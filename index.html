<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMM21167 · ชิ้นงานที่ 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#fbc400;--deep:#e0a800;--ink:#141414;--paper:#fffdf5;--line:#e8dfbf;--soft:#4a4533;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#17150e;--ink:#f6f1dc;--line:#3a3520;--soft:#cbc3a3;color-scheme:dark}}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Kanit,system-ui,sans-serif;font-size:18px;line-height:1.55}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ครึ่งบนสีเหลือง เหมือนสไลด์ "รูปแบบชิ้นงาน" ของอาจารย์ */
.top{background:var(--yellow);color:#141414;padding:clamp(28px,5vw,56px) 20px clamp(26px,4vw,40px);position:relative;overflow-x:clip}
.top::after{content:"";position:absolute;right:-90px;top:-70px;width:340px;height:340px;border-radius:50%;border:34px solid rgba(255,255,255,.55);pointer-events:none}
.top-in{max-width:900px;margin:auto;position:relative;z-index:1}
.code{font-weight:600;font-size:16px;letter-spacing:.04em}
h1{margin:6px 0 0;font-size:clamp(46px,10vw,98px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.bar{width:150px;height:10px;background:var(--deep);border-radius:6px;margin:12px 0 22px}
.facts{margin:0;padding:0;list-style:none;font-size:clamp(20px,3vw,26px);font-weight:600;line-height:1.7}
.facts li::before{content:"";display:inline-block;width:10px;height:10px;background:#141414;border-radius:50%;margin-right:14px;vertical-align:middle;position:relative;top:-2px}

/* แถบเส้นตายสีเหลืองเข้ม เหมือนแถบท้ายสไลด์ */
.due{margin:30px 0 0;background:#141414;color:#fff;border-radius:999px;padding:14px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-weight:600;font-size:clamp(17px,2.6vw,21px);position:relative}
.due b{color:var(--yellow);font-weight:800;font-size:1.25em}

.main{max-width:900px;margin:0 auto;padding:44px 20px 56px}
h2{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:800}
h2::after{content:"";display:block;width:90px;height:8px;background:var(--yellow);border-radius:5px;margin-top:8px}

.list{list-style:none;margin:20px 0 0;padding:0}
.item{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line);color:inherit;text-decoration:none}
.n{width:46px;height:46px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:22px}
.item h3{margin:0;font-size:clamp(20px,3vw,25px);font-weight:800;line-height:1.3}
.item p{margin:2px 0 0;color:var(--soft);font-size:17px}
.btn{background:#141414;color:var(--yellow);font-weight:800;font-size:17px;padding:10px 22px;border-radius:999px;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--yellow);color:#141414}}
.later{color:var(--soft);font-size:16px;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;white-space:nowrap}
a.item.live .n{background:var(--yellow);color:#141414}
a.item.live:hover h3{text-decoration:underline;text-decoration-thickness:4px;text-decoration-color:var(--yellow);text-underline-offset:5px}

@media (max-width:560px){
  .item{grid-template-columns:44px minmax(0,1fr);gap:12px}
  .item .btn,.item .later{grid-column:2;justify-self:start}
  .n{width:40px;height:40px;font-size:19px}
  .due{border-radius:22px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="code">CMM21167</div>
    <h1>งานกลุ่ม<br>ชิ้นที่ 2</h1>
    <div class="bar"></div>
    <ul class="facts">
      <li>วิดีโอแนวตั้ง 9:16</li>
      <li>ยาวไม่เกิน 60 วินาที</li>
      <li>ลง TikTok / Reels / Shorts</li>
      <li>เล่าการเรียนวิชาในคณะนิเทศศาสตร์ SPU</li>
    </ul>
    <div class="due"><span>ส่ง ศุกร์ 23 ต.ค. เวลา 23:59 น.</span><span id="left">เหลือ <b>7</b> วัน</span></div>
  </div>
</header>

<main class="main">
  <h2>เครื่องมือ</h2>
  <ol class="list" id="list"></ol>
</main>

<script>
// รายการเครื่องมือ: เพิ่มได้หนึ่งบรรทัด ใส่ href ถ้ามีหน้าแล้ว
const MODULES = [
  { title:'เลือกตำแหน่งกองถ่าย', desc:'ลงชื่อเลือกตำแหน่ง ใครกดก่อนได้ก่อน', href:'picker.html' },
  { title:'Storyboard', desc:'ภาพร่างเรื่องทีละช็อต' },
  { title:'Breakdown', desc:'แยกสิ่งที่ต้องใช้ในแต่ละฉาก' },
  { title:'Shot list', desc:'ช็อตที่ต้องถ่าย' },
  { title:'ตารางถ่ายทำ', desc:'วัน เวลา สถานที่' },
  { title:'เช็กลิสต์ก่อนส่ง', desc:'เช็กว่าครบก่อนส่ง' },
  { title:'ไลก์ แชร์ คอมเมนต์', desc:'งานกลุ่มอื่นอย่างน้อย 5 ชิ้น' }
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('list').innerHTML = MODULES.map((m,i) => {
  const inner = `<span class="n">${i+1}</span><div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p></div>`;
  return m.href
    ? `<li><a class="item live" href="${esc(m.href)}">${inner}<span class="btn">เข้าใช้งาน →</span></a></li>`
    : `<li><div class="item">${inner}<span class="later">ยังไม่ได้ทำ</span></div></li>`;
}).join('');

const DEADLINE = new Date('2026-10-23T23:59:00+07:00');
(function tick(){
  const ms = DEADLINE - new Date(), el = document.getElementById('left');
  if (ms <= 0) el.textContent = 'หมดเวลาแล้ว';
  else {
    const d = Math.floor(ms/86400000);
    el.innerHTML = d >= 1 ? `เหลือ <b>${d}</b> วัน` : `เหลือ <b>${Math.max(1,Math.ceil(ms/3600000))}</b> ชั่วโมง`;
  }
  setTimeout(tick, 60000);
})();
</script>
</body>
</html>
