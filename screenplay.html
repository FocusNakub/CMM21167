<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>บทพูด · CMM21167</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#fbc400;--ink:#141414;--paper:#fffdf5;--line:#e8dfbf;--soft:#5a5440;--card:#ffffff;--tint:#faf3d6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#17150e;--ink:#f6f1dc;--line:#3a3520;--soft:#cbc3a3;--card:#211e12;--tint:#2c2812;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
html,body{max-width:100%}
body{margin:0;overflow-x:clip;background:var(--paper);color:var(--ink);font-family:Kanit,system-ui,sans-serif;font-size:16px;line-height:1.5}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.top{background:var(--yellow);color:#141414;padding:16px 16px 18px}
.top-in{max-width:688px;margin:auto}
.back{color:#141414;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
h1{margin:4px 0 0;font-size:clamp(28px,6vw,38px);line-height:1.15;font-weight:800}
.sub{margin:2px 0 0;font-weight:600;font-size:15px}

/* แถบเลือกฉาก ติดขอบบน */
.nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px}
.nav-in{max-width:688px;margin:auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;min-width:44px;height:40px;display:grid;place-items:center;padding:0 14px;border:2px solid var(--ink);border-radius:999px;font-weight:600;color:inherit;text-decoration:none;background:var(--card)}
.nav a:hover{background:var(--yellow);color:#141414}

.main{max-width:720px;margin:0 auto;padding:18px 16px 48px}
.scene{margin:0 0 26px;border:2px solid var(--ink);border-radius:14px;background:var(--card);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--tint);border-bottom:2px solid var(--ink)}
.no{font-weight:800;font-size:28px;line-height:1;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.slug{margin:0;font-size:16px;font-weight:800;letter-spacing:.01em;line-height:1.3}
.action{margin:0;padding:12px 14px 4px;color:var(--soft)}

/* รูปแบบบทภาพยนตร์: ชื่อตัวละครอยู่กลาง บทพูดอยู่ใต้ชื่อ */
.script{padding:6px 14px 16px;font-family:Sarabun,Kanit,system-ui,sans-serif;font-size:17px;line-height:1.65}
.line{margin:14px 0 0}
.who{display:block;text-align:center;font-weight:700;letter-spacing:.04em}
.paren{display:block;text-align:center;color:var(--soft);font-size:15px}
.say{display:block;max-width:34em;margin:2px auto 0}
.note{margin:14px 0 0;color:var(--soft);font-style:italic;text-align:center}

.wait{margin:12px 14px 16px;padding:18px 14px;border:2px dashed var(--soft);border-radius:12px;text-align:center;color:var(--soft)}
.wait b{display:block;color:var(--ink);font-weight:600}

@media (max-width:480px){ .script{font-size:16px} }
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="back" href="index.html">← กลับหน้าหลัก</a>
    <h1>บทพูด</h1>
    <p class="sub">Screenplay · 5 ฉาก · <span id="status"></span></p>
  </div>
</header>

<nav class="nav" aria-label="ไปยังฉาก"><div class="nav-in" id="nav"></div></nav>

<main class="main" id="scenes"></main>

<script>
// ใส่บทพูดที่ช่อง lines ของแต่ละฉาก (เว้น [] ไว้จะขึ้นว่ารอบท)
//   พูด:        { who:'ลี', say:'ประโยคที่พูด', paren:'(พูดกับกล้อง)' }   // paren ไม่ใส่ก็ได้
//   บรรยายภาพ:  { note:'ลีปาดเหงื่อ' }
const SCENES = [
  { n:1, slug:'INT. สตูดิโอ - กลางวัน', action:'ลีประกอบอุปกรณ์ไฟทีละขั้นตอนอย่างทะมัดทะแมง ลีปาดเหงื่อแล้วค่อยพูด', lines:[] },
  { n:2, slug:'INT. ในอาคาร - กลางวัน', action:'บาสเดินถ่ายภาพในอาคาร เห็นกล้องแล้วพูด', lines:[] },
  { n:3, slug:'INT. ห้องน้ำ - กลางวัน', action:'โอ้ตนั่งอยู่ในห้องน้ำ แล้วพูด', lines:[] },
  { n:4, slug:'INT. โรงอาหาร - กลางวัน', action:'ลีนั่งกินข้าวอย่างเอร็ดอร่อย แล้วพูดด้วยน้ำเสียง elegant เรื่อง Project based learning', lines:[] },
  { n:5, slug:'EXT. หน้าโลโก SPU - กลางวัน', action:'บาส โอ้ต ลี มารวมตัวกัน แล้วพูดพร้อมกัน', lines:[] }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('nav').innerHTML = SCENES.map(s => `<a href="#s${s.n}" aria-label="ไปฉาก ${s.n}">ฉาก ${s.n}</a>`).join('');

document.getElementById('scenes').innerHTML = SCENES.map(s => `
  <section class="scene" id="s${s.n}" aria-labelledby="h${s.n}">
    <div class="head"><span class="no" aria-hidden="true">${s.n}</span><h2 class="slug" id="h${s.n}">${esc(s.slug)}</h2></div>
    <p class="action">${esc(s.action)}</p>
    ${s.lines.length
      ? `<div class="script">${s.lines.map(l => l.note
          ? `<p class="note">${esc(l.note)}</p>`
          : `<div class="line"><span class="who">${esc(l.who)}</span>${l.paren ? `<span class="paren">${esc(l.paren)}</span>` : ''}<span class="say">${esc(l.say)}</span></div>`).join('')}</div>`
      : `<div class="wait"><b>กำลังรอดำเนินการ</b>ยังไม่มีบทพูดของฉากนี้</div>`}
  </section>`).join('');

const done = SCENES.filter(s => s.lines.length).length;
document.getElementById('status').textContent = done ? `มีบทแล้ว ${done} จาก ${SCENES.length} ฉาก` : 'กำลังรอดำเนินการ';
</script>
</body>
</html>
